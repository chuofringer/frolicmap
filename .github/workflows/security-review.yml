# Security Review: scans pull requests with Anthropic's open-source
# claude-code-security-review action and posts findings as review comments.
#
# The review is skipped until the ANTHROPIC_API_KEY repository secret exists.
# Secrets cannot be tested in a job-level `if`, so the first step checks the
# secret through `env` and publishes an output; the review step is gated on it.
# The same skip happens on pull requests from forks, which receive no secrets.
name: Security Review
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set; skipping the security review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.available == 'true'
        with:
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main @ 2026-10-19
        if: steps.key.outputs.available == 'true'
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: "node_modules,dist,data"
