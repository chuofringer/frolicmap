name: Deploy Worker
on:
  push:
    branches: [main]
    # Only fire on changes that actually land in the deployed bundle.
    # `worker/scripts/**` and `worker/test/**` are dev tooling, not runtime.
    paths:
      - 'worker/src/**'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/migrations/**'
      - 'shared/**'

# Serialize deploys: two merges landing close together would otherwise run
# `d1 migrations apply --remote` concurrently. Shares its group with
# deploy-pages.yml so the two workflows queue against each other too
# (deploy-pages' `seo:remote` step reads `items` directly).
# cancel-in-progress:false so an in-flight migration/deploy always finishes.
concurrency:
  group: deploy-serialize
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Apply any pending D1 migrations BEFORE the worker deploys. If a
      # migration fails the deploy stops, so worker code never references a
      # table/column that doesn't exist yet. `migrations apply` tracks state
      # in the D1 `d1_migrations` table, so re-running is a no-op.
      - run: npx wrangler d1 migrations apply frolicmap-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
