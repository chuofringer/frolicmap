name: Deploy Worker
on:
  push:
    branches: [main]
    # Only fire on changes that actually land in the deployed bundle.
    # `worker/scripts/**` and `worker/test/**` are dev tooling, not runtime.
    paths:
      - 'worker/src/**'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/migrations/**'
      - 'shared/**'

permissions:
  contents: read

# Serialize runs of this workflow: two merges landing close together would
# otherwise run `d1 migrations apply --remote` concurrently.
# cancel-in-progress:false so an in-flight migration/deploy always finishes.
#
# This group is separate from deploy-pages.yml's, so the two workflows no
# longer queue against each other. That is acceptable: migrations are
# additive, and deploy-pages' `seo:remote` step only reads from D1.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can be started from any branch; only main may reach
    # the deploy secrets.
    if: github.ref == 'refs/heads/main'
    # Runs in the `production` GitHub environment (deployment branches
    # restricted to `main`; see docs/setup-cloudflare.md).
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Apply any pending D1 migrations BEFORE the worker deploys. If a
      # migration fails the deploy stops, so worker code never references a
      # table/column that doesn't exist yet. `migrations apply` tracks state
      # in the D1 `d1_migrations` table, so re-running is a no-op.
      - run: npx wrangler d1 migrations apply frolicmap-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
