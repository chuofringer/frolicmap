name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:run
      # VITE_CF_BEAM_TOKEN is deliberately unset: proves the build works
      # without the optional analytics beacon token.
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:run
      # Runs the node:test suites (worker/test/*.test.mjs), which vitest's
      # config deliberately excludes because they use child_process/fs and
      # crash in Miniflare's isolate.
      - run: npm run test:mjs
