version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-root:
        patterns: ["*"]
    # maplibre-gl and react-map-gl must be upgraded together: the wrapper reads
    # the engine's camera API, so majors are done by hand.
    ignore:
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-map-gl"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: monthly
    groups:
      npm-worker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
