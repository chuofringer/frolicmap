version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-root:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: monthly
    groups:
      npm-worker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
